project_id = "shipsprint"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = false
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
# Allows `*.localhost:3000` subdomains, which is how customer subdomains are
# developed locally before the wildcard DNS record exists in production.
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://*.localhost:3000/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Required for local dev: no SMTP server is running, so a magic link cannot be
# delivered otherwise. Must be disabled on the hosted project.
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
