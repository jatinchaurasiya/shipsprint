name: CI (Pull Request Gate)

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit
        # Audit production dependencies only — the code that actually ships.
        # Dev-only build/lint tooling (e.g. the eslint-config-next -> fast-glob
        # -> micromatch -> braces chain) has no runtime exposure and must not
        # block a release; a fresh advisory on a dev-only transitive dep with no
        # compatible upstream fix would otherwise take the whole pipeline down.
        run: npm audit --omit=dev --audit-level=high

  migrations:
    name: Migration integrity & schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate schema.sql
        run: |
          pip install pglast
          python scripts/validate_schema.py
