name: Production CI/CD (EC2)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_clean:
        description: "Force clean Docker build without cache (--no-cache)"
        required: false
        type: boolean
        default: false
      skip_tests:
        description: "Skip test gate (emergency hotfix only)"
        required: false
        type: boolean
        default: false

# Deployments to EC2 must never run concurrently or be interrupted mid-flight.
concurrency:
  group: production-ec2-deployment
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Quality, Build, and Security Gate (Pre-deployment Verification)
  # ============================================================================
  verify:
    name: Test, Lint, Build & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (clean reproducible install)
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint verification
        run: npm run lint -- --max-warnings=0

      - name: Vitest test suite
        run: npm run test

      - name: Next.js standalone production build
        run: npm run build

      - name: Dependency security audit
        # Audit production dependencies only — the code that actually ships.
        # Dev-only tooling (e.g. the eslint-config-next -> fast-glob -> micromatch
        # -> braces chain) is not part of the runtime and must not gate a
        # production deploy; see ci.yml for the rationale.
        run: npm audit --omit=dev --audit-level=high

      - name: Database schema convergence check
        run: |
          pip install pglast
          python scripts/validate_schema.py

  # ============================================================================
  # 2. Build & Push Docker Image (Executed on 16GB GitHub Runner, NOT on EC2)
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]
    if: always() && (needs.verify.result == 'success' || inputs.skip_tests == true)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Guards the silent-empty-build-arg failure. GitHub expands an unset
      # secret to an empty string rather than failing, and NEXT_PUBLIC_* values
      # are inlined into the browser bundle at build time, so a missing secret
      # previously produced an image whose server reported healthy while signup
      # was disabled with every button stuck.
      #
      # Values are read from `env:` rather than interpolated with `${{ }}` inside
      # the script, which is how a secret containing shell metacharacters would
      # become command injection.
      - name: Validate public build arguments
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          MISSING=0
          for VAR in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            VALUE="${!VAR:-}"
            if [ -z "${VALUE//[[:space:]]/}" ]; then
              echo "::error title=Missing secret::$VAR is not configured in repository secrets."
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "========================================================================"
            echo "MISSING REQUIRED BUILD ARGUMENTS"
            echo "========================================================================"
            echo "GitHub -> Settings -> Secrets and variables -> Actions"
            echo ""
            echo "  NEXT_PUBLIC_SUPABASE_URL       e.g. https://abcdefgh.supabase.co"
            echo "                                 (Supabase -> Project Settings -> Data API)"
            echo "  NEXT_PUBLIC_SUPABASE_ANON_KEY  the anon / publishable key from the same page"
            echo ""
            echo "NEXT_PUBLIC_* values are compiled into the browser bundle at build"
            echo "time and cannot be supplied by docker-compose at runtime. Deploying"
            echo "without them produces a site where the server reports healthy and"
            echo "signup is disabled with every button stuck."
            exit 1
          fi
          echo "Public build arguments verified."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Read directly from secrets rather than through a job-level `env:`.
          # This exact form is what produced a successful image build previously;
          # an intermediate revision routed these through `env` and the build
          # step received empty values even though the validation step above saw
          # them. No `${{ }}` inside a `run:` script here, so there is no shell
          # injection surface.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_ROOT_DOMAIN=${{ secrets.ROOT_DOMAIN || 'shipsprint.site' }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL || 'https://shipsprint.site' }}

  # ============================================================================
  # 3. Continuous Deployment to AWS EC2 (Pulls Pre-built Image in 5 Seconds)
  # ============================================================================
  deploy:
    name: Deploy to EC2 Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-push]
    if: always() && needs.build-and-push.result == 'success' && github.ref == 'refs/heads/main'

    steps:
      - name: Validate GitHub Secrets Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          MISSING=0
          if [ -z "$EC2_HOST" ]; then
            echo "::error title=Missing Secret::EC2_HOST is not configured in repository secrets."
            MISSING=1
          fi
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error title=Missing Secret::EC2_SSH_KEY is not configured in repository secrets."
            MISSING=1
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "========================================================================"
            echo "MISSING REQUIRED GITHUB REPOSITORY SECRETS"
            echo "========================================================================"
            echo "To enable automated CI/CD deployments to your EC2 instance, navigate to:"
            echo "GitHub -> Settings -> Secrets and variables -> Actions"
            echo ""
            echo "Add the following secrets:"
            echo "  - EC2_HOST     : Public IP or hostname of EC2 instance (e.g. 54.x.x.x)"
            echo "  - EC2_USER     : SSH username (e.g. ubuntu)"
            echo "  - EC2_SSH_KEY  : Private SSH Key (.pem file content)"
            echo "  - EC2_PORT     : SSH port (optional, default: 22)"
            echo "  - DEPLOY_DIR   : Target directory on EC2 (optional, default: ~/shipsprint)"
            echo "========================================================================"
            exit 1
          fi
          echo "All required deployment secrets are verified."

      - name: Execute Deployment on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          envs: FORCE_CLEAN,DEPLOY_DIR
          script: |
            set -euo pipefail
            TARGET_DIR="${{ secrets.DEPLOY_DIR || '~/shipsprint' }}"
            eval TARGET_DIR="$TARGET_DIR"

            if [ ! -d "$TARGET_DIR" ]; then
              echo "[ERROR] Deployment target directory does not exist: $TARGET_DIR"
              exit 1
            fi

            cd "$TARGET_DIR"
            echo "=== [CI/CD] Fetching latest commit from origin/main ==="
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            chmod +x scripts/deploy.sh

            export FORCE_CLEAN="${{ inputs.force_clean || 'false' }}"
            export DEPLOY_DIR="$TARGET_DIR"
            ./scripts/deploy.sh
